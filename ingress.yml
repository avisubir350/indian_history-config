apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bharata-katha-ingress
  namespace: bharata-katha
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: bharata-katha.example.com   # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bharata-katha-service
                port:
                  number: 80
