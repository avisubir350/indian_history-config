apiVersion: apps/v1
kind: Deployment
metadata:
  name: bharata-katha-app
  namespace: bharata-katha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bharata-katha-app
  template:
    metadata:
      labels:
        app: bharata-katha-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bharata-katha-app
          image: bhartakatha.azurecr.io/bharata-katha-app:1.0.33
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bharata-katha-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bharata-katha-secret
                  key: DB_PASSWORD
            - name: DB_URL
              value: "jdbc:mysql://$(MYSQL_HOST):3306/$(MYSQL_DB_NAME)?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8"
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: bharata-katha-secret
                  key: MYSQL_HOST
            - name: MYSQL_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bharata-katha-secret
                  key: MYSQL_DB_NAME
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC"
          volumeMounts:
            - name: akv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: akv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bharata-katha-akv
